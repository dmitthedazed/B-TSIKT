name: Tests

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile all exercises
        run: |
          find . -name '*.java' -not -path './.git/*' > sources.txt
          javac -cp "lib/*" -d build @sources.txt
